name: Build NRS Billing app (offline Android)

# Builds android/ - the offline app that runs this same Django project on the
# phone. The APK is attached to the run as the "nrs-billing-apk" artifact.
on:
  push:
    branches: [main, master, 'claude/**']
    paths:
      - 'android/**'
      - 'mobile/**'
      - 'accounts/**'
      - 'audit/**'
      - 'documents/**'
      - 'nrs_project/**'
      - 'templates/**'
      - 'static/**'
      - '.github/workflows/android-app.yml'
  workflow_dispatch:

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Must match the Python version in android/app/build.gradle.kts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test the message reader and inbox
        run: |
          pip install Django==5.2.5 django-widget-tweaks whitenoise dj-database-url python-decouple pillow waitress
          python manage.py test documents.tests_inbox

      - name: Build offline copies of CDN assets (Tailwind, fonts, icons)
        run: python mobile/build_offline_assets.py

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/NRS-Billing-${GITHUB_RUN_NUMBER}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: nrs-billing-apk
          path: dist/*.apk
          if-no-files-found: error

  # Installs a debug build on an Android emulator and exercises it end to end.
  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build offline copies of CDN assets
        run: python mobile/build_offline_assets.py
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK for the emulator
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug -PnrsAbis=x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash mobile/ci_device_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-screenshots
          path: screen-*.png
          if-no-files-found: ignore
