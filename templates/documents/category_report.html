{% extends 'base.html' %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="mb-5">
        <h2 class="text-xl md:text-2xl font-black text-gray-800">
            <i class="fas fa-file-invoice-dollar text-emerald-500 mr-2"></i>Category Billed-Items Report
        </h2>
        <p class="text-sm text-gray-500 mt-0.5">Pull every billed line item under a category into an editable table — add custom columns, tweak values, then export to PDF / Excel / Print.</p>
    </div>

    <form method="get" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 space-y-4">
        <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5">Category <span class="text-red-400">*</span></label>
            <select name="category" required class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-400 bg-white">
                <option value="">— Select a category —</option>
                {% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5">Status (optional)</label>
            <select name="status" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-400 bg-white">
                <option value="">All statuses</option>
                {% for value, label in statuses %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5">From (optional)</label>
                <input type="date" name="date_from" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-400">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5">To (optional)</label>
                <input type="date" name="date_to" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-400">
            </div>
        </div>

        <button type="submit" class="w-full inline-flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl shadow-sm font-bold text-sm transition">
            <i class="fas fa-table"></i> Generate Editable Report
        </button>
    </form>
</div>
{% endblock %}
