name: Build NRS Billing app (offline Android)

# Builds android/ - the offline app that runs this same Django project on the
# phone. The APK is attached to the run as the "nrs-billing-apk" artifact.
on:
  push:
    branches: [main, master, 'claude/**']
    paths:
      - 'android/**'
      - 'mobile/**'
      - 'accounts/**'
      - 'audit/**'
      - 'documents/**'
      - 'nrs_project/**'
      - 'templates/**'
      - 'static/**'
      - '.github/workflows/android-app.yml'
  workflow_dispatch:

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Must match the Python version in android/app/build.gradle.kts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test the message reader and inbox
        run: |
          pip install Django==5.2.5 django-widget-tweaks whitenoise dj-database-url python-decouple pillow waitress
          python manage.py test documents.tests_inbox

      - name: Build offline copies of CDN assets (Tailwind, fonts, icons)
        run: python mobile/build_offline_assets.py

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/NRS-Billing.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: nrs-billing-apk
          path: dist/*.apk
          if-no-files-found: error

  # Installs a debug build on an Android emulator and exercises it end to end.
  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build offline copies of CDN assets
        run: python mobile/build_offline_assets.py
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK for the emulator
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug -PnrsAbis=x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash mobile/ci_device_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-screenshots
          path: screen-*.png
          if-no-files-found: ignore

  # Proves the app can update itself: once with Android's confirmation, then silently.
  update-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build offline copies of CDN assets
        run: python mobile/build_offline_assets.py
      - uses: gradle/actions/setup-gradle@v4
      - name: Build three versions
        working-directory: android
        run: |
          mkdir -p updates
          for v in 100 101 102; do
            ./gradlew --no-daemon assembleDebug -PnrsAbis=x86_64 -PnrsVersionCode=$v
            cp app/build/outputs/apk/debug/app-debug.apk updates/app-$v.apk
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Update the app on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash mobile/ci_update_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-test-screens
          path: update-*.png
          if-no-files-found: ignore

  # Publishes the tested APK as a GitHub Release. This is the direct download
  # link, and it is where installed apps look for updates.
  release:
    needs: [build, device-test, update-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nrs-billing-apk
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="2.0.${GITHUB_RUN_NUMBER}"
          NOTES="$(git log -1 --pretty=%s)"
          python3 - "$VERSION" "$NOTES" <<'PY'
          import json, os, sys
          import hashlib
          digest = hashlib.sha256(open("dist/NRS-Billing.apk", "rb").read()).hexdigest()
          json.dump({"versionCode": int(os.environ["GITHUB_RUN_NUMBER"]), "versionName": sys.argv[1],
                     "notes": sys.argv[2], "apk": "NRS-Billing.apk", "sha256": digest}, open("dist/version.json", "w"))
          PY
          gh release create "app-v${VERSION}" dist/NRS-Billing.apk dist/version.json \
            --title "NRS Billing ${VERSION}" --notes "${NOTES}" --target "${GITHUB_SHA}" --latest
